<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROUTE - 訪問スケジュール管理</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      <div>ROUTE <span class="sub">訪問スケジュール</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" data-page="dashboard" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>ダッシュボード</span>
      </a>
      <a href="#" data-page="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span>スケジュール</span>
      </a>
      <a href="#" data-page="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>カレンダー</span>
      </a>
      <a href="#" data-page="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1,6 1,22 8,18 16,22 23,18 23,2 16,6 8,2 1,6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span>ルートマップ</span>
      </a>
      <a href="#" data-page="staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span>スタッフ</span>
      </a>
      <a href="#" data-page="patients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>患者一覧</span>
      </a>
      <a href="#" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>設定</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sf-label">v1.0 Demo</div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="header">
      <h1 id="header-title" class="header-title">ダッシュボード</h1>
      <div class="header-right">
        <div class="system-selector-wrap">
          <label class="system-selector-label">システム</label>
          <select id="system-select" class="system-select">
            <option value="ROUTE" selected>ROUTE</option>
            <option value="HOMIS">HOMIS</option>
            <option value="NURSEE">NURSEE</option>
          </select>
        </div>
        <input type="date" id="global-date" value="2026-03-30">
        <button class="btn btn-primary" id="btn-run-schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-1.64-8.36L23 10"/></svg>
          スケジュール実行
        </button>
      </div>
    </header>

    <div class="content">

      <!-- Dashboard -->
      <div id="page-dashboard" class="page active">
        <div id="dash-stats" class="stats-row"></div>
        <div id="dash-workload"></div>
        <div id="dash-timeline"></div>
      </div>

      <!-- Schedule detail -->
      <div id="page-schedule" class="page">
        <div id="schedule-steps"></div>
        <div id="schedule-unassigned"></div>
      </div>

      <!-- Calendar -->
      <div id="page-calendar" class="page">
        <div id="calendar-container"></div>
      </div>

      <!-- Route Map -->
      <div id="page-map" class="page">
        <div id="map-page-content"></div>
      </div>

      <!-- Staff -->
      <div id="page-staff" class="page">
        <div id="staff-search"></div>
        <div class="staff-grid" id="staff-cards"></div>
        <div id="staff-pager"></div>
        <div id="staff-shifts"></div>
      </div>

      <!-- Patients -->
      <div id="page-patients" class="page">
        <div id="patients-list"></div>
      </div>

      <!-- Settings -->
      <div id="page-settings" class="page">
        <div id="settings-content"></div>
      </div>

    </div><!-- .content -->
  </div><!-- .main -->
</div><!-- .app -->

<div id="toast" class="toast"></div>

<!-- Booking info modal -->
<div id="staff-modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeStaffModal()">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-staff-info">
        <span class="staff-avatar modal-avatar" id="modal-staff-avatar"></span>
        <div>
          <div class="modal-staff-name" id="modal-staff-name"></div>
          <div class="modal-staff-role" id="modal-staff-role"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeStaffModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- New booking modal -->
<div id="booking-create-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeBookingCreate()">
  <div class="modal-box" style="width:420px">
    <div class="modal-header">
      <div class="modal-staff-info">
        <div>
          <div class="modal-staff-name">新規ブッキング</div>
          <div class="modal-staff-role" id="bc-date-label"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeBookingCreate()">✕</button>
    </div>
    <div class="modal-body">
      <div class="bc-field">
        <label class="bc-lbl">患者</label>
        <select id="bc-patient" class="setting-input" style="width:100%"></select>
      </div>
      <div class="bc-field">
        <label class="bc-lbl">スタッフ</label>
        <select id="bc-staff" class="setting-input" style="width:100%"></select>
      </div>
      <div class="bc-field bc-time-row">
        <div>
          <label class="bc-lbl">開始</label>
          <input type="time" id="bc-start" class="setting-input">
        </div>
        <div>
          <label class="bc-lbl">終了</label>
          <input type="time" id="bc-end" class="setting-input">
        </div>
      </div>
      <div id="bc-error" style="color:var(--danger);font-size:12px;margin-top:4px;min-height:18px"></div>
      <div class="bc-actions">
        <button class="btn btn-primary" id="bc-confirm">追加</button>
        <button class="btn btn-outline" onclick="closeBookingCreate()">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<!-- Patient create / edit modal -->
<div id="patient-modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closePatientModal()">
  <div class="modal-box" style="width:520px;max-height:90vh;overflow-y:auto">
    <div class="modal-header">
      <div class="modal-staff-info">
        <div>
          <div class="modal-staff-name" id="pm-title">新規患者登録</div>
          <div class="modal-staff-role" id="pm-id-label"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closePatientModal()">✕</button>
    </div>
    <div class="modal-body" id="pm-body"></div>
  </div>
</div>

<!-- Core libs -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- App scripts — order matters -->
<script src="js/data.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages/page-dashboard.js"></script>
<script src="js/pages/page-schedule.js"></script>
<script src="js/pages/page-calendar.js"></script>
<script src="js/pages/page-map.js"></script>
<script src="js/pages/page-staff.js"></script>
<script src="js/pages/page-patients.js"></script>
<script src="js/pages/page-settings.js"></script>
<script src="js/app.js"></script>

</body>
</html>
